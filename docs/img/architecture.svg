<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420" role="img" aria-labelledby="t d">
  <title id="t">audited-soc-agent architecture</title>
  <desc id="d">An alert goes to an agent loop that calls five read-only tools over synthetic event data. The agent submits a verdict with cited event ids. A deterministic evidence checker reads the run, a static case page shows it, and a person approves any action as a dry run.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; }
    .ok { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.5; }
    .warn { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .edge { stroke: #57606a; stroke-width: 2; fill: none; }
    .head { fill: #57606a; }
    .t { font: 700 17px system-ui, "Segoe UI", Arial, sans-serif; fill: #1f2328; }
    .s { font: 400 13.5px system-ui, "Segoe UI", Arial, sans-serif; fill: #1f2328; }
    .l { font: 400 13px system-ui, "Segoe UI", Arial, sans-serif; fill: #424a53; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #8b949e; }
      .ok { fill: #12261e; stroke: #3fb950; }
      .warn { fill: #2d2208; stroke: #d29922; }
      .edge { stroke: #8b949e; }
      .head { fill: #8b949e; }
      .t, .s { fill: #e6edf3; }
      .l { fill: #b1bac4; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>
  <rect class="bg" width="1100" height="420"/>

  <!-- row 1 -->
  <rect class="box" x="20" y="40" width="180" height="96" rx="8"/>
  <text class="t" x="110" y="72" text-anchor="middle">Alert</text>
  <text class="s" x="110" y="96" text-anchor="middle">one of 30 synthetic</text>
  <text class="s" x="110" y="116" text-anchor="middle">alerts (A-007)</text>

  <rect class="box" x="240" y="40" width="180" height="96" rx="8"/>
  <text class="t" x="330" y="72" text-anchor="middle">Agent loop</text>
  <text class="s" x="330" y="96" text-anchor="middle">Claude with tool use</text>
  <text class="s" x="330" y="116" text-anchor="middle">budget cap, all turns kept</text>

  <rect class="ok" x="460" y="40" width="180" height="96" rx="8"/>
  <text class="t" x="550" y="68" text-anchor="middle">5 read-only tools</text>
  <text class="s" x="550" y="90" text-anchor="middle">get_alert · search_events</text>
  <text class="s" x="550" y="108" text-anchor="middle">process_tree · host_timeline</text>
  <text class="s" x="550" y="126" text-anchor="middle">network_connections</text>

  <rect class="box" x="680" y="40" width="180" height="96" rx="8"/>
  <text class="t" x="770" y="72" text-anchor="middle">data/</text>
  <text class="s" x="770" y="96" text-anchor="middle">synthetic events,</text>
  <text class="s" x="770" y="116" text-anchor="middle">the only thing read</text>

  <line class="edge" x1="200" y1="88" x2="236" y2="88" marker-end="url(#a)"/>
  <line class="edge" x1="424" y1="88" x2="456" y2="88" marker-start="url(#a)" marker-end="url(#a)"/>
  <line class="edge" x1="644" y1="88" x2="676" y2="88" marker-end="url(#a)"/>

  <!-- row 2 -->
  <rect class="box" x="240" y="230" width="180" height="96" rx="8"/>
  <text class="t" x="330" y="262" text-anchor="middle">Verdict</text>
  <text class="s" x="330" y="286" text-anchor="middle">every claim cites</text>
  <text class="s" x="330" y="306" text-anchor="middle">event ids and quotes</text>

  <rect class="ok" x="460" y="230" width="180" height="96" rx="8"/>
  <text class="t" x="550" y="262" text-anchor="middle">Evidence checker</text>
  <text class="s" x="550" y="286" text-anchor="middle">plain code, no model:</text>
  <text class="s" x="550" y="306" text-anchor="middle">cites exist, quotes match</text>

  <rect class="box" x="680" y="230" width="180" height="96" rx="8"/>
  <text class="t" x="770" y="262" text-anchor="middle">Case page</text>
  <text class="s" x="770" y="286" text-anchor="middle">static HTML, no JS needed</text>
  <text class="s" x="770" y="306" text-anchor="middle">injection text in red</text>

  <rect class="warn" x="900" y="230" width="180" height="96" rx="8"/>
  <text class="t" x="990" y="262" text-anchor="middle">Person approves</text>
  <text class="s" x="990" y="286" text-anchor="middle">dry run: recorded,</text>
  <text class="s" x="990" y="306" text-anchor="middle">never sent or executed</text>

  <line class="edge" x1="330" y1="140" x2="330" y2="226" marker-end="url(#a)"/>
  <text class="l" x="342" y="188">submit_verdict</text>
  <line class="edge" x1="424" y1="278" x2="456" y2="278" marker-end="url(#a)"/>
  <line class="edge" x1="644" y1="278" x2="676" y2="278" marker-end="url(#a)"/>
  <line class="edge" x1="864" y1="278" x2="896" y2="278" marker-end="url(#a)"/>

  <!-- notes -->
  <text class="l" x="20" y="372">Replay: the recorded live run is served back at $0, so the demo needs no key and no network.</text>
  <text class="l" x="20" y="394">The answer key sits outside data/: no tool can reach it. It is used only by the evals.</text>
</svg>
